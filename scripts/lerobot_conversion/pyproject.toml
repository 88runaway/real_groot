[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_conversion"
version = "0.1.0"
requires-python = ">=3.10,<3.12"

dependencies = [
    "huggingface_hub",
    "jsonlines",
    "numpy",
    "pyarrow",
    "tqdm",
    "lerobot==0.4.1",
]

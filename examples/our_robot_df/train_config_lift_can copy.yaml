# ════════════════════════════════════════════════════════════════
#  GR00T-DF 微调训练配置 - Block-wise Diffusion Forcing
#
#  基于 our_robot 标准配置，启用 Diffusion Forcing 架构改进：
#  - 块级独立噪声调度 (monotone pyramid)
#  - 推理时金字塔去噪，早期 block 先收敛
#  - 损失重加权补偿早期 block 梯度不足
#
#  单臂/双臂切换:
#    单臂(右): modality_config = our_robot_config.py + modality.json (默认)
#    双臂:     modality_config = our_robot_bimanual_config.py + modality_bimanual.json
#    在 train.sh 中通过下面的 arm_mode 选项设置
#
#  数据集: lift_can_orig
#  规模:   99 episodes, ~40K frames, 30 FPS
#  任务:   单手立瓶（短时操作 ~15s/集）
# ════════════════════════════════════════════════════════════════

# ── 手臂模式 ──────────────────────────────────────────────────────
# "right" = 仅右臂 (29维 action: 右臂7D + 右手22D)
# "bimanual" = 双臂 (58维 action: 左臂7D + 左手22D + 右臂7D + 右手22D)
arm_mode: right

# ── 路径 ─────────────────────────────────────────────────────────
paths:
  base_model_path: /mnt/netdata/Team/Personal/chenyiyang/zjb/ckpts/groot_base
  backbone_model_name: /mnt/netdata/Team/Personal/chenyiyang/zjb/ckpts/cosmos_base
  dataset_path: /mnt/netdata/Team/Personal/chenyiyang/zjb/data/groot_tactile/lift_can
  output_dir: /mnt/netdata/Team/Personal/chenyiyang/zjb/ckpts/groot_our_robot_df

# ── 任务 ─────────────────────────────────────────────────────────
task:
  description: "Stand the bottle upright."
  experiment_name: lift_can

# ── 动作 chunk 配置 ──────────────────────────────────────────────
action:
  chunk_size: 40

# ── Diffusion Forcing 配置 ────────────────────────────────────────
diffusion_forcing:
  enabled: true
  # action_horizon=40, block_size=5 → 8 blocks
  block_size: 5
  # 训练时 100% 使用 DF（不与标准 FM 混合）
  mix_prob: 1.0
  # monotone: 前面的 block 更早收敛，与推理时 pyramid schedule 对齐
  block_time_sampling: monotone
  # 损失重加权：补偿 monotone 下前 block 梯度覆盖不足
  reweight_gamma: 0.0
  # Beta(phase_alpha, 1) 控制 phase 分布，1.0 = Uniform
  phase_alpha: 1.0

# ── 触觉注入配置 ──────────────────────────────────────────────────
tactile:
  enabled: true
  encoder_type: ftp
  # FTP 预训练权重目录 (包含 hpt_tokenizer/ 和 model.safetensors)
  encoder_path: /mnt/netdata/Team/Personal/chenyiyang/zjb/ckpts/ftp_model
  # 触觉传感器名称（用于加载对应的 T3 encoder checkpoint）
  sensor_name: SharpaWave
  # 输出维度必须等于 input_embedding_dim (1536)
  encoder_output_dim: 1536
  # 冻结 backbone（仅 output_proj 参与训练）
  freeze_backbone: false
  # 每个手指图像 resize 目标大小 (FTP encoder expects 224×224)
  target_size: 224

  # ── 手指选择（掩码格式）──
  # 格式: [拇指, 食指, 中指, 无名指, 小指], 1=使用, 0=不使用
  right_fingers: [1, 1, 1, 0, 0]
  left_fingers:  [0, 0, 0, 0, 0]

  # 每个选中手指对应的 FTP function area 索引
  # 顺序对应所有 mask=1 的手指（先右手再左手）
  # 如 right=[1,1,0,0,0] → 右手拇指=24, 右手食指=25
  func_area_indices: [24, 25,26]

  # ── 触觉注意力控制 ──
  # block_aligned: true → action block k 仅 attend 对应的 tactile block k（时序局部 conditioning）
  #   适用于 diffusion forcing 训练；推理时自动禁用（所有 block 共享触觉）
  block_aligned: true
  # attend_self: false → 触觉 token 之间不互相 attend（纯被动 KV 注入模式）
  #   ftp 输出 1 token/指，互相 attend 无实际意义，设 false 减少冗余计算
  attend_self: false

# ── 训练超参 ──────────────────────────────────────────────────────
training:
  max_steps: 15000
  save_steps: 1000
  save_total_limit: 10
  learning_rate: 6.0e-5
  weight_decay: 1.0e-5
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  global_batch_size: 256
  dataloader_num_workers: 16
  shard_size: 1024
  num_shards_per_epoch: 100000
  episode_sampling_rate: 0.1

# ── 模型微调策略 ───────────────────────────────────────────────────
model:
  tune_llm: true
  tune_visual: false
  tune_projector: true
  tune_diffusion_model: true
  state_dropout_prob: 0.25

# ── 数据增强 ──────────────────────────────────────────────────────
augmentation:
  color_jitter:
    brightness: 0.3
    contrast: 0.4
    saturation: 0.5
    hue: 0.08
  use_percentiles: true

# ── 硬件 & 日志 ───────────────────────────────────────────────────
hardware:
  num_gpus: 8

logging:
  use_wandb: true
  wandb_project: finetune-gr00t-n1d7-df
